<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Gopal Tent House">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b862"/>
      <stop offset="55%" stop-color="#c79437"/>
      <stop offset="100%" stop-color="#9d7327"/>
    </linearGradient>
  </defs>

  <!-- Medallion -->
  <circle cx="60" cy="60" r="56" fill="#6d1b32"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.6"/>

  <!-- Canopy / shamiana roof with scalloped valance -->
  <path d="M60 28 L96 62 H24 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 28 L60 62" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>
  <path d="M24 62 q6 7 12 0 q6 7 12 0 q6 7 12 0 q6 7 12 0 q6 7 12 0"
        fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Finial -->
  <circle cx="60" cy="25" r="3.5" fill="url(#gold)"/>
  <path d="M60 21.5 L60 16" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pillars -->
  <path d="M33 70 L33 92 M87 70 L87 92" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Archway between pillars -->
  <path d="M42 92 L42 80 a18 18 0 0 1 36 0 L78 92" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Ground line -->
  <path d="M26 94 H94" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
